<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1026">
  <title>Game Box</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="couples/styles.css">
</head>
<body>
  <main>
    <section class="screen center">
      <h1 class="title" data-pt="Caixa de Jogos">Game Box</h1>
      <p class="tagline" data-pt="Jogos para jogar juntos, num só celular.">Games to play together, on one phone.</p>
      <nav class="stack">
        <a class="game-card" href="couples/">
          <span class="game-name" data-pt="Casais">Couples</span>
          <span class="game-desc" data-pt="Aposto que você acha que eu diria… · Tribunal do Casal">Bet You Think I'll Say… · Couples Court</span>
        </a>
      </nav>
    </section>
  </main>
  <script>
    if (navigator.language?.toLowerCase().startsWith("pt")) {
      document.documentElement.lang = "pt-BR";
      document.querySelectorAll("[data-pt]").forEach((el) => { el.textContent = el.dataset.pt; });
      document.title = "Caixa de Jogos";
    }
  </script>
</body>
</html>
